[tools]
java = "temurin-25"

[env]
JAVACC_VERSION = "6.1.2"
JAVACC_JAR = "{{config_root}}/.tools/javacc-{{env.JAVACC_VERSION}}.jar"

[tasks.javacc]
description = "Download the JavaCC jar (includes JJTree) from Maven Central"
run = '''
[ -f "$JAVACC_JAR" ] && exit 0
mkdir -p "$(dirname "$JAVACC_JAR")"
curl -fsSL -o "$JAVACC_JAR" "https://repo1.maven.org/maven2/net/java/dev/javacc/javacc/$JAVACC_VERSION/javacc-$JAVACC_VERSION.jar"
'''

[tasks.generate]
description = "Copy src/ into build/ and regenerate the parser with JJTree + JavaCC"
depends = ["javacc"]
run = '''
cp src/*.java src/SimpL.jit build/
cd build
java -cp "$JAVACC_JAR" jjtree SimpL.jit
java -cp "$JAVACC_JAR" javacc SimpL.jj
'''

[tasks.build]
description = "Compile build/ into out/"
depends = ["generate"]
run = '''
rm -rf out
javac -nowarn -d out build/*.java
'''

[tasks.run]
description = "Run the parser and semantic checker on a SimpL file, e.g. mise run run build/example.spl"
depends = ["build"]
run = 'java -cp out SimpL < {{arg(name="file")}}'

[tasks.test]
description = "Run every SimpL program in build/ and tests/ and compare its output with tests/<name>.expected"
depends = ["build"]
run = '''
failed=0
TMPDIR_DIFF=$(mktemp)
for f in build/*.spl tests/*.spl; do
  name=$(basename "$f" .spl)
  expected="tests/$name.expected"
  if [ ! -f "$expected" ]; then
    echo "MISSING $expected (run: mise run test:update)"; failed=1; continue
  fi
  if java -cp out SimpL < "$f" 2>&1 | diff -u "$expected" - > "$TMPDIR_DIFF"; then
    echo "ok   $name"
  else
    echo "FAIL $name"; cat "$TMPDIR_DIFF"; failed=1
  fi
done
exit $failed
'''

[tasks."test:update"]
description = "Regenerate the tests/<name>.expected snapshots from the current checker output"
depends = ["build"]
run = '''
for f in build/*.spl tests/*.spl; do
  java -cp out SimpL < "$f" > "tests/$(basename "$f" .spl).expected" 2>&1
done
'''

[tasks."check:generated"]
description = "Fail if the committed build/ differs from what src/ generates (run after generate)"
depends = ["generate"]
run = '''
if ! git diff --exit-code --stat -- build/ || [ -n "$(git ls-files --others --exclude-standard -- build/)" ]; then
  echo "build/ is out of date with src/. Run 'mise run generate' and commit the result."
  exit 1
fi
'''
